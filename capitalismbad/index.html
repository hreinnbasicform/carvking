<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat-astrophe</title>
<meta name="description" content="Cat-astrophe: an artistic film.">
<meta property="og:title" content="Cat-astrophe">
<meta property="og:description" content="Cat-astrophe: an artistic film.">
<meta property="og:type" content="video.other">
<style>
*{box-sizing:border-box}
html{background:#e4e3df}
body{margin:0;min-height:100vh;background:#e4e3df;color:#0a0a0a;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1280px;margin:0 auto;padding:clamp(20px,4vw,56px)}
header{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid #0a0a0a;padding-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
h1{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900;font-size:clamp(3rem,13vw,11rem);line-height:.82;letter-spacing:-.06em;text-transform:lowercase;margin:clamp(28px,6vw,72px) 0 clamp(40px,8vw,110px);word-break:break-word}
.room{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;gap:clamp(20px,4vw,56px);align-items:end}
figure{grid-column:2;margin:0;background:#fff;padding:clamp(14px,2.4vw,32px);box-shadow:0 1px 0 #c9c7c1,0 30px 60px -30px rgba(0,0,0,.35)}
video{display:block;height:min(78vh,860px);max-width:100%;aspect-ratio:9/16;background:#000;object-fit:contain}
.label{grid-column:3;align-self:end;max-width:240px;font-size:12px;line-height:1.45;background:#fff;padding:14px 16px;border-left:3px solid #0a0a0a}
.label b{display:block;font-size:13px;margin-bottom:2px}
.label i{font-style:normal;color:#555}
.dl{display:inline-block;margin-top:12px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0a0a0a;text-decoration:none;border:1.5px solid #0a0a0a;padding:5px 9px}
.dl:hover{background:#0a0a0a;color:#fff}
footer{margin-top:clamp(48px,8vw,120px);border-top:1px solid #0a0a0a;padding-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:760px){
.room{grid-template-columns:1fr}
figure,.label{grid-column:1}
video{height:auto;width:100%}
.label{max-width:none}
}
</style>
</head>
<body>
<main>
<header><span>Raum 01</span><span>Film</span></header>
<h1>Cat-<br>astrophe</h1>
<div class="room">
<figure><video controls playsinline preload="metadata" src="catastrophe.mp4"></video></figure>
<div class="label"><b>Cat-astrophe, 2026</b>Film, colour, sound<br>4 min 38 s<br><i>On capitalism and the environment.</i><br><a class="dl" href="catastrophe.mp4" download>Download</a></div>
</div>
<footer>carvking.com</footer>
</main>
</body>
</html>
